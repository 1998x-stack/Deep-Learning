<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="hidden-units-8-t hidden-units-8-d"><title id="hidden-units-8-t">解释边界</title><desc id="hidden-units-8-d">可视化是探索工具，不是自动因果解释。</desc><rect width="880" height="360" rx="20" fill="#fffdf9"/><text x="36" y="48" font-size="22" font-weight="700" fill="#203035">解释边界</text><line x1="36" y1="66" x2="844" y2="66" stroke="#e4e8e5"/><rect x="45" y="100" width="365" height="205" rx="16" fill="#eaf4f1" stroke="#147f80"/><rect x="470" y="100" width="365" height="205" rx="16" fill="#f8eee9" stroke="#d06d4d"/><text x="75" y="150" font-size="23" font-weight="700" fill="#147f80">可观察</text><text x="75" y="205" font-size="18" fill="#203035">激活响应</text><text x="500" y="150" font-size="23" font-weight="700" fill="#d06d4d">不可直接断言</text><text x="500" y="205" font-size="18" fill="#203035">神经元等于概念</text></svg>