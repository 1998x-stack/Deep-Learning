<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="gradient-4-t gradient-4-d"><title id="gradient-4-t">学习率大小</title><desc id="gradient-4-d">步长要与目标函数局部曲率相匹配。</desc><rect width="880" height="360" rx="20" fill="#fffdf9"/><text x="36" y="48" font-size="22" font-weight="700" fill="#203035">学习率大小</text><line x1="36" y1="66" x2="844" y2="66" stroke="#e4e8e5"/><rect x="45" y="100" width="365" height="205" rx="16" fill="#eaf4f1" stroke="#147f80"/><rect x="470" y="100" width="365" height="205" rx="16" fill="#f8eee9" stroke="#d06d4d"/><text x="75" y="150" font-size="23" font-weight="700" fill="#147f80">η 太小</text><text x="75" y="205" font-size="18" fill="#203035">下降缓慢</text><text x="500" y="150" font-size="23" font-weight="700" fill="#d06d4d">η 太大</text><text x="500" y="205" font-size="18" fill="#203035">震荡或发散</text></svg>