<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="output-units-8-t output-units-8-d"><title id="output-units-8-t">输出头设计</title><desc id="output-units-8-d">先明确预测对象，再设计输出层。</desc><rect width="880" height="360" rx="20" fill="#fffdf9"/><text x="36" y="48" font-size="22" font-weight="700" fill="#203035">输出头设计</text><line x1="36" y1="66" x2="844" y2="66" stroke="#e4e8e5"/><path d="M80 180H800" stroke="#b6c4c0" stroke-width="5"/><circle cx="80" cy="180" r="24" fill="#147f80"/><text x="80" y="187" text-anchor="middle" font-size="18" fill="white">1</text><text x="80" y="235" text-anchor="middle" font-size="15" fill="#203035">确认标签</text><circle cx="320" cy="180" r="24" fill="#d06d4d"/><text x="320" y="187" text-anchor="middle" font-size="18" fill="white">2</text><text x="320" y="235" text-anchor="middle" font-size="15" fill="#203035">选择分布</text><circle cx="560" cy="180" r="24" fill="#7461ba"/><text x="560" y="187" text-anchor="middle" font-size="18" fill="white">3</text><text x="560" y="235" text-anchor="middle" font-size="15" fill="#203035">设计输出</text><circle cx="800" cy="180" r="24" fill="#916c22"/><text x="800" y="187" text-anchor="middle" font-size="18" fill="white">4</text><text x="800" y="235" text-anchor="middle" font-size="15" fill="#203035">选择损失</text></svg>