name: Site QA and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser QA dependency
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Validate site assets and evidence
        run: python scripts/validate_site.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run responsive browser QA
        run: python scripts/browser_qa.py --output reports/browser-qa
      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-report
          path: reports/browser-qa/
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
